name: publish

on:
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Publish api & extensions to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Attach deployable jars to release
        run: |
          files=()

          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(
            find engine extensions \
              -path "*/build/libs/*.jar" \
              -type f \
              ! -name "*-sources.jar" \
              ! -name "*-javadoc.jar" \
              -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No deployable JARs found"
            exit 1
          fi

          echo "JARs to upload:"
          printf '  %s\n' "${files[@]}"

          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "${files[@]}" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
