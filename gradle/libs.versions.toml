[versions]
kotlin = '2.2.20'
shadow = '9.1.0'

apollo-api = '1.2.1'
apollo-wrapper = '0.0.1'

spigot-api = '1.8.8-R0.1-SNAPSHOT'

adventure-api = '4.26.1'
adventure-platform-bukkit = '4.4.1'

menu-api = '1.5.5'

packetevents-api = '2.11.1'

[plugins]
shadow = { id = 'com.gradleup.shadow', version.ref = 'shadow' }

[libraries]
kotlin-gradle-plugin = { module = 'org.jetbrains.kotlin:kotlin-gradle-plugin', version.ref = 'kotlin' }

apollo-api = { module = 'com.lunarclient:apollo-api', version.ref = 'apollo-api' }
apollo-wrapper = { module = 'io.github.kuraiwtf:apollo-wrapper', version.ref = 'apollo-wrapper' }

spigot-api = { module = 'org.spigotmc:spigot', version.ref = 'spigot-api' }

adventure-bom = { module = 'net.kyori:adventure-bom', version.ref = 'adventure-api' }
adventure-platform-bukkit = { module = 'net.kyori:adventure-platform-bukkit', version.ref = 'adventure-platform-bukkit' }
adventure-mini-message = { module = 'net.kyori:adventure-text-minimessage' }

menu-api = { module = 'net.j4c0b3y:MenuAPI-core', version.ref = 'menu-api' }

packetevents-spigot = { module = 'com.github.retrooper:packetevents-spigot', version.ref = 'packetevents-api' }

[bundles]
apollo = ['apollo-api', 'apollo-wrapper']
adventure = ['adventure-platform-bukkit', 'adventure-mini-message']
